name: Deploy to GitHub Pages

on:
  push:
    # The movement branch is listed on purpose: the movement is being judged by
    # feel in the real build, and waiting for a merge to publish each version
    # makes the review loop far too slow. It publishes to the same Pages site, so
    # while this line is here the live URL is whatever was pushed most recently —
    # drop it once the movement work lands on main.
    #
    # This alone is NOT enough. The `github-pages` environment has its own
    # deployment-branch policy, and it currently allows only the default branch,
    # so the build job runs green and the deploy job is refused before its first
    # step. To let this work: Settings -> Environments -> github-pages ->
    # Deployment branches -> add `claude/css-movement-alignment-j974gg`.
    branches: [main, claude/css-movement-alignment-j974gg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The patch-notes generator reads merge commits out of the checkout,
          # so it needs history. The default depth of 1 would leave exactly one
          # commit and therefore at most one merge — the panel would show a
          # single entry, or none at all when the push is not itself a merge.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Writes public/patch-notes.json for the menu's patch-notes chip. Must run
      # before the build, which is what copies public/ into dist.
      #
      # The list is read from git, so the merge commit that triggered this run
      # is in it by construction and the panel can never lag a merge behind.
      # The token is optional: it is used only to pull hand-written
      # `## Patch Notes` sections, and without it every entry falls back to its
      # PR title. A changelog is never worth a red deploy.
      - run: npm run notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
